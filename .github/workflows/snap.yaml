name: snap
on:
  push:
    branches:
      - citadel
      - fortress
  pull_request:
    branches:
      - citadel
      - fortress
  workflow_dispatch:

jobs:
  snaps:
    uses: canonical/robotics-actions-workflows/.github/workflows/snap.yaml@main
    secrets:
      snapstore-login: ${{ secrets.STORE_LOGIN }}
    with:
      runs-on: '[["self-hosted", "linux", "X64", "two-xlarge", "noble"]]'
      snap-track: '${{ github.base_ref || github.ref_name }}'
      snap-test-script: |
        #!/bin/bash
        set -euxo pipefail

        gazebo.gz gazebo --version
