name: snap
on:
  push:
    tags:
      - 'harmonic/*'
    branches:
      - harmonic
  pull_request:
    branches:
      - harmonic
  workflow_dispatch:

jobs:
  snaps:
    uses: canonical/robotics-actions-workflows/.github/workflows/snap.yaml@main
    secrets:
      snapstore-login: ${{ secrets.STORE_LOGIN }}
    with:
      snapcraft-channel: 'latest/stable'
      runs-on: '["self-hosted-linux-amd64-jammy-xlarge", "self-hosted-linux-arm64-noble-large"]'
      snap-track: harmonic
      snap-test-script: |
        #!/bin/bash
        set -euxo pipefail

        gazebo.gz sim --version
