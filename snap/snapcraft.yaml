name: gazebo
version: '0.1.0'
summary: Simulate before you build.
description: |
  Gazebo (formerly known as Ignition [1]) is an open source robotics simulator maintained by Open Robotics [2].

  Through Gazebo, users have access to high fidelity physics, rendering, and sensor models.
  Additionally, users and developers have multiple points of entry to simulation,
  including a graphical user interface, plugins, and asynchronous message passing and services.

  Gazebo brings a fresh approach to simulation with a complete toolbox of development libraries and cloud services to make simulation easy.
  Iterate fast on your new physical designs in realistic environments with high fidelity sensor streams.
  Test control strategies in safety, and take advantage of simulation in continuous integration tests.

  **Note**: This is a beta release, do expect bugs and limitations. If you encounter any, please do report it [3].

  Installation Instructions:

  * Install Gazebo from a terminal,

  `snap install gazebo --edge`

  * Test your installation,

  `gazebo.gz gazebo shapes.sdf`

  If you are following the Gazebo 'Getting Started' documentation, you can replace the entire 'Step 1: Install' with the snap command and resume at 'Step 2: Run'.

  Learn more about Gazebo on the official website [4].

  [1] https://community.gazebosim.org/t/a-new-era-for-gazebo/1356

  [2] https://openrobotics.org/

  [3] https://github.com/canonical/gazebo_snap

  [4] https://gazebosim.org/home

contact: ubuntu-robotics-community@canonical.com
issues: https://github.com/canonical/gazebo_snap
source-code: https://github.com/canonical/gazebo_snap
website: https://gazebosim.org/home
license: Apache-2.0

grade: stable
confinement: strict
base: core24

# Gazebo support for arm64 is 'best-effort'
platforms:
    amd64:
        build-on: [amd64]
        build-for: [amd64]
    arm64:
        build-on: [arm64]
        build-for: [arm64]

parts:
  gazebo:
    plugin: colcon
    source: .
    colcon-cmake-args:
      - "-DBUILD_TESTING=OFF"
      - "-DBUILD_DOCS=OFF"
      - "-DCMAKE_BUILD_TYPE=Release"
      - "-DCMAKE_C_COMPILER_LAUNCHER=ccache"
      - "-DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
      - "-DSKIP_usd=true"
      - "-DSKIP_optix=true"
      - "--event-handlers=console_direct+"

    build-environment:
      #- IGNITION_VERSION: harmonic
      - GZ_VERSION: harmonic
      #- PKG_CONFIG_PATH: ""
      - PYTHONPATH: "/usr/lib/python3/dist-packages"
    build-packages:
      - wget
      - git
      - python3-vcstool
      - ccache
      - binutils-dev
      - build-essential
      - cmake
      - curl
    stage-packages:
      - ros-jazzy-ros-environment

    override-pull: |
      craftctl default
      /root/project/snap/local/override_pull.sh

    override-build: |
      craftctl default
      for entry in "$CRAFT_PART_INSTALL/opt/ros/snap/opt/"*/share/gz/*.yaml; do
        sed -i "s|$CRAFT_PART_INSTALL|/snap/$SNAPCRAFT_PROJECT_NAME/current|" "$entry"
      done

  fastdds-no-shared-memory:
    plugin: dump
    source: snap/local/
    organize:
      'fastdds_no_shared_memory.xml': usr/share/

  cleanup:
    after: [gazebo, ros2-jazzy/ros2-launch]
    plugin: nil
    build-packages: [fd-find] # installing fd-find and run it once is usually faster than calling find once
    override-prime: |
      /root/project/snap/local/cleanup.sh

apps:

  # We're not creating the `gazebo` app just yet has this could conflict
  # with a (non-Ignition) Gazebo prior install.
  gz:
    environment:
      RUBYLIB: '$SNAP/usr/local/lib/site_ruby/3.2.0:$SNAP/usr/local/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/site_ruby:$SNAP/usr/local/lib/site_ruby:$SNAP/usr/lib/ruby/vendor_ruby/3.2.0:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/ruby/vendor_ruby/3.2.0:$SNAP/usr/lib/ruby/vendor_ruby:$SNAP/usr/lib/ruby/3.2.0:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/ruby/3.2.0'
      GZ_HOMEDIR: '$SNAP_USER_DATA'
      GZ_RENDERING_RESOURCE_PATH: '$SNAP/opt/ros/snap/opt/gz_rendering_vendor/share/gz/gz-rendering8'
      OGRE2_RESOURCE_PATH: '$SNAP/opt/ros/snap/opt/gz_ogre_next_vendor/lib/OGRE-Next'
      GZ_SIM_SYSTEM_PLUGIN_PATH: '$SNAP/opt/ros/snap/lib'
      GZ_RENDERING_PLUGIN_PATH: '$SNAP/opt/ros/snap/lib:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/OGRE-1.9.0'
      GZ_SENSORS_PLUGIN_PATH: '$SNAP/opt/ros/snap/lib'
      GZ_SIM_RENDER_ENGINE_PATH: '$SNAP/opt/ros/snap/opt/gz_rendering_vendor/lib/gz-rendering-8/engine-plugins'
      GZ_MSGS_INSTALL_PREFIX: '$SNAP/opt/ros/snap/opt/gz_msgs_vendor'
      GZ_PHYSICS_INSTALL_PREFIX: '$SNAP/opt/ros/snap/opt/gz_physics_vendor'
      GZ_LAUNCH_INSTALL_PREFIX: '$SNAP/opt/ros/snap/opt/gz_launch_vendor'
      GZ_GUI_INSTALL_PREFIX: '$SNAP/opt/ros/snap/opt/gz_gui_vendor'
      GZ_SIM_INSTALL_PREFIX: '$SNAP/opt/ros/snap/opt/gz_sim_vendor'
      GZ_RENDERING_INSTALL_PREFIX: '$SNAP/opt/ros/snap/opt/gz_rendering_vendor'
    command: opt/ros/snap/opt/gz_tools_vendor/bin/gz
    command-chain: [path_modifier.sh, qt_snap_environment.sh]
    plugs:
      - network
      - network-bind
      - home
      - desktop
      - opengl
      - wayland
      - x11
    extensions: [ros2-jazzy]

  ros-gz-create:
    command: ros2 run ros_gz_sim create
    command-chain: [path_modifier.sh]
    environment:
      FASTRTPS_DEFAULT_PROFILES_FILE: ${SNAP}/usr/share/fastdds_no_shared_memory.xml
      GZ_HOMEDIR: '$SNAP_USER_DATA'
      GZ_SENSORS_PLUGIN_PATH: '$SNAP/opt/ros/snap/lib'
      GZ_MSGS_INSTALL_PREFIX: '$SNAP/opt/ros/snap/opt/gz_msgs_vendor'
      GZ_LAUNCH_INSTALL_PREFIX: '$SNAP/opt/ros/snap/opt/gz_launch_vendor'
    plugs: [network, network-bind, home]
    extensions: [ros2-jazzy]

  ros-gz-bridge:
    command: ros2 run ros_gz_bridge
    command-chain: [path_modifier.sh]
    environment:
      FASTRTPS_DEFAULT_PROFILES_FILE: ${SNAP}/usr/share/fastdds_no_shared_memory.xml
      GZ_HOMEDIR: '$SNAP_USER_DATA'
      GZ_SENSORS_PLUGIN_PATH: '$SNAP/opt/ros/snap/lib'
      GZ_MSGS_INSTALL_PREFIX: '$SNAP/opt/ros/snap/opt/gz_msgs_vendor'
      GZ_LAUNCH_INSTALL_PREFIX: '$SNAP/opt/ros/snap/opt/gz_launch_vendor'
    plugs: [network, network-bind, home]
    extensions: [ros2-jazzy]
